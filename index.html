<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهمة محقق التدريب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#080828; --navy-2:#0e0e38; --ice:#EBF4FF; --gold:#FFBC3A;
    --blue:#4D88E8; --orange:#F26444; --cyan:#40BDA9; --white:#fff;
    --font-en:'Poppins',sans-serif; --font-ar:'Tajawal',sans-serif; --font:var(--font-ar);
    --mono-en:'Space Mono',monospace; --mono-ar:'Tajawal',sans-serif; --mono:var(--mono-ar);
  }
  html[lang="en"]{ --font:var(--font-en); --mono:var(--mono-en); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;
    background:
      radial-gradient(1400px 700px at 8% -12%, rgba(77,136,232,.26), transparent 58%),
      radial-gradient(1100px 600px at 108% 10%, rgba(255,188,58,.18), transparent 55%),
      radial-gradient(900px 500px at 50% 105%, rgba(64,189,169,.14), transparent 55%),
      var(--navy);
    color:var(--ice); font-family:var(--font);}

  .app{max-width:1320px; margin:0 auto; padding:0 32px 90px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 0 24px; margin-bottom:54px;
    border-bottom:1px solid rgba(235,244,255,.1);
  }
  .brand img{ height:36px; width:auto; display:block; }
  .top-tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(235,244,255,.45); border:1px solid rgba(235,244,255,.16); border-radius:999px;
    padding:8px 16px; display:flex; align-items:center; gap:8px;
  }
  .top-tag .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .lang-toggle{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); background:rgba(255,188,58,.08); border:1px solid rgba(255,188,58,.35); border-radius:999px;
    padding:8px 18px; cursor:pointer; transition:background .2s, transform .15s;
  }
  .lang-toggle:hover{ background:rgba(255,188,58,.18); transform:translateY(-1px); }
  .lang-toggle:active{ transform:translateY(0) scale(.97); }

  .dir-arrow-fwd::before{ content:"\2192"; }
  .dir-arrow-back::before{ content:"\2190"; }
  html[dir="rtl"] .dir-arrow-fwd::before{ content:"\2190"; }
  html[dir="rtl"] .dir-arrow-back::before{ content:"\2192"; }
  html[dir="rtl"] .quote::before{ content:"\00AB"; }
  html[dir="rtl"] .quote::after{ content:"\00BB"; }

  .head{text-align:center; max-width:820px; margin:0 auto 40px;}
  .eyebrow{font-family:var(--mono); letter-spacing:.2em; font-size:12.5px; text-transform:uppercase; color:var(--gold); margin-bottom:18px;
    display:flex; align-items:center; justify-content:center; gap:14px;}
  .eyebrow::before,.eyebrow::after{content:""; height:1px; width:36px; background:rgba(255,188,58,.45);}
  h1{font-size:clamp(34px,5.2vw,58px); font-weight:900; margin:0 0 20px; line-height:1.12; letter-spacing:-0.01em;}
  h1 span{color:var(--gold);}
  .sub{color:rgba(235,244,255,.68); font-size:17px; line-height:1.65; max-width:640px; margin:0 auto;}

  .stat-strip{
    display:flex; align-items:center; justify-content:center; gap:16px; margin:34px auto 64px;
    max-width:620px; padding:18px 28px; border-radius:16px;
    background:rgba(235,244,255,.045); border:1px solid rgba(235,244,255,.12);
  }
  .stat-strip .num{ font-family:var(--mono); font-size:36px; font-weight:700; color:var(--gold); line-height:1; flex-shrink:0; }
  .stat-strip .txt{ font-size:13.5px; line-height:1.5; color:rgba(235,244,255,.65); text-align:left; }
  .stat-strip .txt b{ color:var(--ice); font-weight:700; }

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
  @media (max-width:1100px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} .stat-strip{flex-direction:column; text-align:center;} .stat-strip .txt{text-align:center;} }

  .card{
    position:relative;
    background:linear-gradient(165deg, rgba(235,244,255,.05), rgba(235,244,255,.015));
    border:1px solid rgba(235,244,255,.14); border-radius:22px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
  }
  .card:hover{
    transform:translateY(-8px);
    border-color:var(--card-accent, rgba(255,188,58,.5));
    box-shadow:0 24px 48px -16px rgba(0,0,0,.55), 0 0 0 1px var(--card-accent, rgba(255,188,58,.3));
  }
  .card:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .card-num{
    position:absolute; top:14px; inset-inline-end:16px; z-index:2;
    font-family:var(--mono); font-size:34px; font-weight:700;
    color:rgba(255,255,255,.16); line-height:1; letter-spacing:-.02em;
    transition:color .25s;
  }
  .card:hover .card-num{ color:var(--card-accent, rgba(255,188,58,.55)); }

  .photo-wrap{ position:relative; aspect-ratio:3/4; overflow:hidden; background:#04041a; }
  .photo-wrap img, .photo-wrap .avatar-svg{ width:100%; height:100%; object-fit:cover; object-position:center 12%; display:block; transition:transform .4s; }
  .card:hover .photo-wrap img, .card:hover .photo-wrap .avatar-svg{ transform:scale(1.05); }
  .photo-wrap::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(8,8,40,.75) 92%, var(--navy) 100%);
    pointer-events:none;
  }
  .photo-wrap::before{
    content:""; position:absolute; inset:0; z-index:1;
    background:var(--card-accent, var(--gold)); opacity:.16; mix-blend-mode:color;
    pointer-events:none;
  }

  .badge{
    position:absolute; bottom:12px; left:14px; right:14px; z-index:2;
    font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:7px 12px; border-radius:10px; font-weight:700;
    background:rgba(8,8,40,.65); backdrop-filter:blur(6px);
    border:1px solid var(--card-accent, rgba(255,188,58,.4));
    color:var(--card-accent, var(--gold));
  }

  .info{ padding:20px 20px 24px; position:relative; }
  .name{ font-weight:800; font-size:21px; margin-bottom:5px; letter-spacing:-.01em; }
  .role{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(235,244,255,.4); margin-bottom:14px; }
  .quote{ font-size:13.5px; line-height:1.6; color:rgba(235,244,255,.72); font-style:italic; min-height:52px; }
  .quote::before{ content:"\201C"; color:var(--card-accent, var(--gold)); font-style:normal; font-weight:700; }
  .quote::after{ content:"\201D"; color:var(--card-accent, var(--gold)); font-style:normal; font-weight:700; }

  .tap-hint{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--card-accent, var(--gold)); margin-top:16px; display:flex; align-items:center; gap:7px;
    font-weight:700; opacity:.85;
  }
  .tap-hint::after{ content:"\2192"; transition:transform .2s; }
  html[dir="rtl"] .tap-hint::after{ content:"\2190"; }
  .card:hover .tap-hint::after{ transform:translateX(4px); }
  html[dir="rtl"] .card:hover .tap-hint::after{ transform:translateX(-4px); }

  .card.c-risk{ --card-accent: var(--orange); }
  .card.c-motivation{ --card-accent: var(--gold); }
  .card.c-practice{ --card-accent: var(--cyan); }
  .card.c-social{ --card-accent: var(--blue); }
  .card.c-general{ --card-accent: var(--gold); }

  .overlay{
    position:fixed; inset:0; background:rgba(4,4,20,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:100;
  }
  .overlay.show{ display:flex; }
  .modal{
    position:relative; max-width:660px; width:100%; max-height:85vh; overflow-y:auto;
    background:var(--navy-2); border:1px solid rgba(235,244,255,.16); border-radius:24px;
    padding:42px 44px 40px; animation:pop .22s ease;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-close{
    position:absolute; top:20px; inset-inline-end:20px; width:36px; height:36px; border-radius:50%;
    background:rgba(235,244,255,.08); border:1px solid rgba(235,244,255,.18); color:var(--ice);
    font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ background:rgba(235,244,255,.18); }
  .modal-badge{
    display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:999px; font-weight:700; margin-bottom:18px;
    background:rgba(255,255,255,.06);
  }
  .modal-eyebrow{ font-family:var(--mono); letter-spacing:.18em; font-size:11.5px; text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
  .modal-title{ font-size:30px; font-weight:900; margin:0 0 20px; line-height:1.22; letter-spacing:-.01em; }
  .modal-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 22px; }
  .modal-stat{ border-radius:14px; padding:14px 16px; border:1px solid rgba(235,244,255,.14); background:rgba(235,244,255,.04); }
  .modal-stat .ms-label{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(235,244,255,.5); margin-bottom:6px; }
  .modal-stat .ms-val{ font-size:15px; font-weight:800; line-height:1.35; }
  .modal-stat.ms-test{ border-color:rgba(64,189,169,.4); background:rgba(64,189,169,.08); }
  .modal-stat.ms-test .ms-val{ color:var(--cyan); font-family:var(--mono); font-size:26px; }
  .modal-stat.ms-field{ border-color:rgba(242,100,68,.4); background:rgba(242,100,68,.08); }
  .modal-stat.ms-field .ms-val{ color:var(--orange); }
  @media (max-width:480px){ .modal-stats{ grid-template-columns:1fr; } }
  .modal-body{ font-size:16px; line-height:1.75; color:rgba(235,244,255,.85); margin-bottom:22px; }
  .modal-closing{ font-size:16px; line-height:1.65; color:var(--gold); font-style:italic; font-weight:700; }

  footer{ text-align:center; margin-top:0; padding-top:28px; border-top:1px solid rgba(235,244,255,.08);
    font-family:var(--mono); font-size:11px; color:rgba(235,244,255,.35); }

  #mainView{ transition:opacity .35s ease; }
  #mainView.hiding{ opacity:0; pointer-events:none; }

  .finish-row{ display:flex; justify-content:center; margin-top:56px; }
  .finish-btn{
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:var(--gold); color:var(--navy); border:none; border-radius:999px;
    padding:16px 38px; cursor:pointer; display:flex; align-items:center; gap:10px;
    box-shadow:0 14px 30px -10px rgba(255,188,58,.5); transition:transform .18s, box-shadow .18s;
  }
  .finish-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 36px -10px rgba(255,188,58,.6); }
  .finish-btn:active{ transform:translateY(0) scale(.98); }
  .finish-btn span{ transition:transform .18s; display:inline-block; }
  .finish-btn:hover span{ transform:translateX(4px); }

  /* ===== Final animated stat section ===== */
  .finale{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:flex-start; justify-content:center; text-align:center;
    overflow-y:auto; padding:100px 32px;
    background:radial-gradient(900px 600px at 50% 40%, rgba(255,188,58,.10), transparent 65%), #050518;
  }
  .finale.show{ display:flex; }
  .finale-back{
    position:absolute; top:28px; left:32px; z-index:3;
    background:rgba(235,244,255,.06); border:1px solid rgba(235,244,255,.16); color:rgba(235,244,255,.6);
    font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; border-radius:999px;
    padding:9px 18px; cursor:pointer;
  }
  .finale-back:hover{ background:rgba(235,244,255,.12); color:var(--ice); }
  .finale-orb{
    position:absolute; border-radius:50%; filter:blur(2px); pointer-events:none;
    animation:drift 14s ease-in-out infinite;
  }
  .finale-orb.o1{ width:420px; height:420px; background:radial-gradient(circle, rgba(77,136,232,.28), transparent 70%); top:-140px; left:-100px; animation-duration:16s; }
  .finale-orb.o2{ width:360px; height:360px; background:radial-gradient(circle, rgba(255,188,58,.22), transparent 70%); bottom:-120px; right:-80px; animation-duration:19s; animation-delay:-4s; }
  .finale-orb.o3{ width:260px; height:260px; background:radial-gradient(circle, rgba(64,189,169,.22), transparent 70%); top:40%; right:8%; animation-duration:13s; animation-delay:-7s; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(24px,-28px) scale(1.06); }
  }

  .finale-inner{ position:relative; z-index:2; max-width:760px; margin:auto; }
  .finale-eyebrow{
    font-family:var(--mono); letter-spacing:.22em; font-size:12.5px; text-transform:uppercase; color:var(--gold);
    margin-bottom:28px; opacity:0; transform:translateY(14px);
  }
  .finale-eyebrow::before,.finale-eyebrow::after{content:"\2014 "; opacity:.5;}

  .finale-num-wrap{ position:relative; display:inline-block; margin-bottom:30px; }
  .finale-num{
    font-family:var(--mono); font-size:clamp(90px,16vw,180px); font-weight:700; line-height:1;
    background:linear-gradient(180deg, #FFD98A 0%, var(--gold) 55%, #C8871A 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform:scale(.85);
    filter:drop-shadow(0 0 40px rgba(255,188,58,.35));
  }
  .finale-num-ring{
    position:absolute; inset:-18px; border-radius:50%; border:1px solid rgba(255,188,58,.25);
    opacity:0; transform:scale(.9);
  }

  .finale-line{ font-size:clamp(20px,2.6vw,26px); line-height:1.55; color:var(--ice); font-weight:600; margin-bottom:18px;
    opacity:0; transform:translateY(16px); }
  .finale-line b{ color:var(--gold); }
  .finale-sub{ font-size:14.5px; color:rgba(235,244,255,.5); line-height:1.7; max-width:520px; margin:0 auto 34px;
    opacity:0; transform:translateY(14px); }

  .finale-people{ display:flex; align-items:center; justify-content:center; gap:-10px; margin-bottom:22px;
    opacity:0; transform:translateY(14px); }
  .finale-people .avatar{
    width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid #050518;
    margin-inline-start:-14px; box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .finale-people .avatar:first-child{ margin-inline-start:0; }
  .finale-people .avatar img, .finale-people .avatar .avatar-svg{ width:100%; height:100%; object-fit:cover; object-position:center 12%; }

  .finale-principles{
    max-width:560px; margin:0 auto 30px; padding:22px 24px;
    background:rgba(255,188,58,.05); border:1px solid rgba(255,188,58,.18); border-radius:18px;
    text-align:start; opacity:0; transform:translateY(14px);
  }
  .finale-principles h3{
    font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); margin:0 0 14px; text-align:center;
  }
  .finale-principles ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .finale-principles li{
    display:flex; gap:10px; align-items:baseline; font-size:13.5px; line-height:1.55; color:rgba(235,244,255,.75);
  }
  .finale-principles li b{ color:var(--ice); font-weight:700; }
  .finale-principles li > span:first-child{ color:var(--gold); flex-shrink:0; }
  .finale.in-view .finale-principles{ animation:riseIn .7s ease 1.15s forwards; }

  .finale-source{
    font-family:var(--mono); font-size:10.5px; color:rgba(235,244,255,.32);
    opacity:0; transform:translateY(10px);
  }

  .finale.in-view .finale-eyebrow{ animation:riseIn .7s ease forwards; }
  .finale.in-view .finale-num{ animation:numIn .9s cubic-bezier(.2,.8,.2,1) .15s forwards; }
  .finale.in-view .finale-num-ring{ animation:ringIn 1.1s ease .15s forwards; }
  .finale.in-view .finale-line{ animation:riseIn .7s ease .45s forwards; }
  .finale.in-view .finale-sub{ animation:riseIn .7s ease .6s forwards; }
  .finale.in-view .finale-people{ animation:riseIn .7s ease .75s forwards; }
  .finale.in-view .finale-source{ animation:riseIn .7s ease 1.35s forwards; }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes numIn{ to{ opacity:1; transform:scale(1); } }
  @keyframes ringIn{ 0%{opacity:0; transform:scale(.9);} 60%{opacity:1;} 100%{opacity:0; transform:scale(1.35);} }

  @media (max-width:600px){
    .finale{ padding:80px 20px; }
  }

  /* ===== Matching challenge ===== */
  .match-card{ cursor:pointer; }
  .match-card .badge{ transition:background .2s, color .2s, border-color .2s; }
  .match-card.solved{ outline:2px solid var(--card-accent, var(--gold)); outline-offset:2px; }
  .match-card.solved .badge{ background:var(--card-accent, var(--gold)); color:var(--navy); }
  .match-card.hint-shake{ animation:shakeCard .4s ease; }
  @keyframes shakeCard{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .match-card.drop-hover{ box-shadow:0 0 0 2px var(--card-accent, var(--gold)) inset, 0 24px 48px -16px rgba(0,0,0,.55); }

  .challenge-panel{
    max-width:900px; margin:40px auto 0; padding:24px 26px 26px;
    background:rgba(235,244,255,.035); border:1px solid rgba(235,244,255,.12); border-radius:20px;
    text-align:center;
  }
  .challenge-instructions{ font-size:14.5px; color:rgba(235,244,255,.7); line-height:1.6; margin:0 0 18px; }
  .chip-tray{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:46px; margin-bottom:18px; }
  .chip{
    font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:.03em;
    padding:12px 20px; border-radius:999px; cursor:grab; user-select:none;
    background:rgba(255,188,58,.1); border:1.5px dashed rgba(255,188,58,.5); color:var(--gold);
    transition:transform .15s, opacity .2s, box-shadow .15s;
  }
  .chip:hover{ transform:translateY(-2px); box-shadow:0 8px 18px -8px rgba(255,188,58,.5); }
  .chip.selected{ box-shadow:0 0 0 2px var(--gold); background:rgba(255,188,58,.22); }
  .chip.used{ opacity:0; pointer-events:none; transform:scale(.6); }
  .chip.dragging-ghost{
    position:fixed; z-index:200; pointer-events:none; opacity:.92;
    box-shadow:0 14px 30px -8px rgba(0,0,0,.6);
  }
  .score-pill{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; font-weight:700;
    color:var(--ice); background:rgba(235,244,255,.06); border:1px solid rgba(235,244,255,.16);
    padding:9px 20px; border-radius:999px;
  }
  .score-icon{ font-size:15px; }
  #finishBtn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  #finishBtn:disabled:hover{ transform:none; }

  .modal-reflect{
    margin-top:24px; padding-top:22px; border-top:1px solid rgba(235,244,255,.1);
  }
  .modal-reflect .reflect-q{ font-size:14px; font-weight:700; color:var(--ice); margin-bottom:12px; }
  .modal-reflect .reflect-opts{ display:flex; flex-direction:column; gap:10px; }
  .modal-reflect .reflect-opt{
    text-align:start; font-family:var(--font); font-size:13.5px; color:rgba(235,244,255,.85);
    background:rgba(235,244,255,.05); border:1px solid rgba(235,244,255,.15); border-radius:12px;
    padding:11px 16px; cursor:pointer; transition:background .2s, border-color .2s;
  }
  .modal-reflect .reflect-opt:hover{ background:rgba(235,244,255,.1); }
  .modal-reflect .reflect-opt.picked{ border-color:var(--gold); background:rgba(255,188,58,.1); }
  .modal-reflect .reflect-feedback{
    margin-top:12px; font-size:13.5px; line-height:1.6; color:var(--gold); font-weight:600;
    opacity:0; transform:translateY(6px); transition:opacity .3s, transform .3s;
  }
  .modal-reflect .reflect-feedback.show{ opacity:1; transform:translateY(0); }

  .finale-score{
    font-family:var(--mono); font-size:14px; color:var(--gold); font-weight:700;
    margin:-8px 0 14px; opacity:0; transform:translateY(12px);
  }
  .finale-meta{
    font-size:13px; color:rgba(235,244,255,.42); line-height:1.7; max-width:480px; margin:0 auto 30px;
    opacity:0; transform:translateY(12px);
  }
  .finale.in-view .finale-score{ animation:riseIn .7s ease .5s forwards; }
  .finale.in-view .finale-meta{ animation:riseIn .7s ease .62s forwards; }

  @media (max-width:600px){
    .challenge-panel{ padding:20px 16px 22px; }
    .chip{ padding:10px 16px; font-size:11.5px; }
  }
  .modal-reflect .reflect-opt.correct{ border-color:var(--cyan); background:rgba(64,189,169,.14); }
  .modal-reflect .reflect-opt.wrong{ border-color:var(--orange); background:rgba(242,100,68,.1); opacity:.75; }
  .modal-reflect .reflect-opt:disabled{ cursor:default; }
  .modal-reflect .reflect-feedback.is-wrong{ color:var(--orange); }
  .play-fix{ margin-top:14px; display:none; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 16px; border-radius:12px; background:rgba(255,188,58,.08); border:1px dashed rgba(255,188,58,.45); }
  .play-fix.show{ display:flex; animation:pop .25s ease; }
  .play-fix .pf-label{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:rgba(235,244,255,.55); }
  .play-fix .pf-val{ font-weight:800; font-size:14.5px; color:var(--gold); }

  .finale-reasons{ max-width:720px; margin:0 auto 30px; opacity:0; transform:translateY(14px); }
  .finale-reasons h3{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 14px; }
  .reasons-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .reason-tile{ border-radius:12px; padding:14px 10px 12px; display:flex; flex-direction:column; justify-content:space-between; gap:8px; min-height:96px;
    border:1px solid rgba(235,244,255,.18); }
  .reason-tile .rt-title{ font-weight:800; font-size:13.5px; line-height:1.35; }
  .reason-tile .rt-who{ font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; opacity:.8; }
  .reason-tile.r1{ background:#0B1F5C; color:#fff; border-color:rgba(77,136,232,.5); }
  .reason-tile.r2{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .reason-tile.r3{ background:var(--ice); color:var(--navy); border-color:var(--ice); }
  .reason-tile.r4{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .finale.in-view .finale-reasons{ animation:riseIn .7s ease .9s forwards; }
  @media (max-width:640px){ .reasons-row{ grid-template-columns:repeat(2,1fr); } }

  /* ===================== GAMIFIED LAYER ===================== */
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:400; }

  /* Intro / mission */
  .intro{ text-align:center; max-width:760px; margin:0 auto; padding-bottom:20px; }
  .intro h1{ margin-bottom:18px; }
  .intro .sub{ margin-bottom:30px; }
  .intro-people{ display:flex; justify-content:center; margin:0 0 30px; }
  .intro-people .avatar{ width:64px; height:64px; border-radius:50%; overflow:hidden; border:3px solid var(--navy);
    margin-inline-start:-16px; box-shadow:0 6px 18px rgba(0,0,0,.45); position:relative; }
  .intro-people .avatar:first-child{ margin-inline-start:0; }
  .intro-people .avatar img{ width:100%; height:100%; object-fit:cover; object-position:center 12%; }
  .intro-people .avatar::after{ content:"?"; position:absolute; inset:0; display:grid; place-items:center;
    background:rgba(8,8,40,.45); color:var(--gold); font-family:var(--mono); font-weight:700; font-size:22px; }
  .intro-rules{ list-style:none; margin:0 auto 30px; padding:20px 22px; max-width:560px; text-align:start;
    display:flex; flex-direction:column; gap:12px; border-radius:18px;
    background:rgba(235,244,255,.045); border:1px solid rgba(235,244,255,.12); }
  .intro-rules li{ display:flex; gap:12px; align-items:flex-start; font-size:14.5px; line-height:1.55; color:rgba(235,244,255,.82); }
  .intro-rules .ri{ width:30px; height:30px; flex-shrink:0; border-radius:9px; display:grid; place-items:center; font-size:15px;
    background:rgba(255,188,58,.12); border:1px solid rgba(255,188,58,.3); }
  .intro-form{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .intro-form input{
    width:100%; max-width:360px; font-family:var(--font); font-size:16px; color:var(--ice); text-align:center;
    background:rgba(235,244,255,.06); border:1px solid rgba(235,244,255,.2); border-radius:14px; padding:14px 18px; outline:none;
  }
  .intro-form input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,188,58,.18); }
  .intro-form input::placeholder{ color:rgba(235,244,255,.4); }
  .start-btn{ font-size:15px; padding:18px 44px; animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ box-shadow:0 14px 30px -10px rgba(255,188,58,.5); } 50%{ box-shadow:0 14px 44px -6px rgba(255,188,58,.85); } }

  /* HUD */
  .hud{ display:none; position:sticky; top:0; z-index:60; margin:0 -8px 30px; padding:10px 12px;
    align-items:center; gap:10px; border-radius:0 0 18px 18px;
    background:rgba(8,8,40,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(235,244,255,.12); border-top:none; }
  .hud.on{ display:flex; }
  .hud-cell{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }
  .hud-label{ font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:rgba(235,244,255,.5); white-space:nowrap; }
  .hud-val{ font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ice); line-height:1; display:inline-block; }
  .hud-val.gold{ color:var(--gold); }
  .hud-progress{ flex:1.4; }
  .hud-bar{ width:100%; max-width:140px; height:6px; border-radius:99px; background:rgba(235,244,255,.12); overflow:hidden; margin-top:3px; }
  .hud-bar > div{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--gold)); transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .hud-sound{ width:40px; height:40px; flex-shrink:0; border-radius:12px; cursor:pointer; font-size:17px;
    background:rgba(235,244,255,.06); border:1px solid rgba(235,244,255,.16); color:var(--ice); }
  .pop{ animation:hudPop .35s ease; }
  @keyframes hudPop{ 40%{ transform:scale(1.35); color:var(--gold); } }

  .float-pts{ position:fixed; z-index:450; pointer-events:none; font-family:var(--mono); font-weight:700; font-size:22px;
    color:var(--gold); text-shadow:0 2px 12px rgba(255,188,58,.6); animation:floatUp 1.1s ease-out forwards; transform:translate(-50%,-50%); }
  .float-pts.bonus{ color:var(--cyan); text-shadow:0 2px 12px rgba(64,189,169,.6); font-size:18px; }
  @keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%,-30%) scale(.7); } 15%{ opacity:1; transform:translate(-50%,-60%) scale(1.15); } 100%{ opacity:0; transform:translate(-50%,-260%) scale(1); } }

  /* Cases */
  .cases-head{ text-align:center; margin:0 auto 26px; }
  .cases-head h2{ margin:0 0 6px; font-size:26px; font-weight:900; }
  .cases-head p{ margin:0; color:rgba(235,244,255,.6); font-size:14.5px; }
  .lock-layer{ position:absolute; inset:0; z-index:4; display:none; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.06em; color:rgba(235,244,255,.75); text-align:center; padding:0 12px; }
  .lock-ico{ font-size:36px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
  .card.locked{ cursor:not-allowed; }
  .card.locked .lock-layer{ display:flex; }
  .card.locked .photo-wrap img{ filter:grayscale(1) blur(4px) brightness(.45); }
  .card.locked .info{ opacity:.35; }
  .card.locked .badge{ opacity:0; }
  .card.locked:hover{ transform:none; box-shadow:none; border-color:rgba(235,244,255,.14); }
  .card.locked:hover .card-num{ color:rgba(255,255,255,.16); }
  .card.active{ border-color:var(--card-accent); animation:activeGlow 2.2s ease-in-out infinite; }
  @keyframes activeGlow{ 0%,100%{ box-shadow:0 0 0 0 transparent; } 50%{ box-shadow:0 0 0 3px rgba(255,188,58,.18), 0 0 44px -8px var(--card-accent); } }
  .card.solved{ outline:2px solid var(--card-accent); outline-offset:2px; }
  .card.solved .badge{ background:var(--card-accent); color:var(--navy); }
  .card.unlocking{ animation:unlockPop .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes unlockPop{ 0%{ transform:scale(.94); } 50%{ transform:scale(1.04); } 100%{ transform:scale(1); } }
  .card.shake{ animation:shakeCard .4s ease; }
  .solved-stamp{ position:absolute; top:12px; inset-inline-start:14px; z-index:3; display:none;
    font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.06em;
    padding:5px 10px; border-radius:99px; background:var(--card-accent); color:var(--navy); }
  .card.solved .solved-stamp{ display:block; }

  /* Case modal */
  .modal-badge.unknown{ color:rgba(235,244,255,.6) !important; border:1px dashed rgba(235,244,255,.3) !important; }
  .step{ margin-top:24px; padding-top:22px; border-top:1px solid rgba(235,244,255,.1); animation:pop .3s ease; }
  .step-head{ display:flex; gap:10px; align-items:center; font-weight:800; font-size:15.5px; margin-bottom:14px; line-height:1.45; }
  .step-num{ width:28px; height:28px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
    background:var(--gold); color:var(--navy); font-family:var(--mono); font-size:13px; font-weight:700; }
  .step.done .step-num{ background:var(--cyan); }
  .opts{ display:flex; flex-direction:column; gap:10px; }
  .opts.gaps{ display:grid; grid-template-columns:1fr 1fr; }
  .opt{ text-align:start; font-family:var(--font); font-size:14px; line-height:1.5; color:rgba(235,244,255,.9);
    background:rgba(235,244,255,.05); border:1px solid rgba(235,244,255,.16); border-radius:12px;
    padding:12px 16px; cursor:pointer; transition:background .2s, border-color .2s, transform .12s; }
  .opt:hover:not(:disabled){ background:rgba(235,244,255,.1); transform:translateY(-1px); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--cyan); background:rgba(64,189,169,.16); color:var(--ice); font-weight:700; }
  .opt.wrong{ border-color:rgba(242,100,68,.6); background:rgba(242,100,68,.08); opacity:.6; text-decoration:line-through; text-decoration-color:rgba(242,100,68,.6); }
  .opt.shake{ animation:shakeCard .4s ease; }
  .fb{ margin-top:12px; font-size:13.5px; line-height:1.65; font-weight:600; color:var(--cyan); }
  .fb.bad{ color:var(--orange); }
  .case-closing{ margin-top:22px; font-size:15.5px; line-height:1.65; color:var(--gold); font-style:italic; font-weight:700; }
  .case-done{ margin-top:20px; padding:20px 18px; border-radius:18px; text-align:center;
    background:linear-gradient(160deg, rgba(255,188,58,.1), rgba(64,189,169,.06)); border:1px solid rgba(255,188,58,.3); animation:pop .35s ease; }
  .case-done .cd-label{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:rgba(235,244,255,.55); }
  .case-done .cd-pts{ font-family:var(--mono); font-size:34px; font-weight:700; color:var(--gold); line-height:1.2; margin:4px 0 6px; }
  .case-done .cd-bonus{ font-size:13px; color:var(--cyan); font-weight:700; min-height:18px; }
  .case-done .finish-btn{ margin:16px auto 0; }
  .play-fix{ display:flex; }

  /* Finale rank */
  .rank-card{ max-width:540px; margin:0 auto 54px; padding:30px 24px 24px; border-radius:26px;
    background:linear-gradient(160deg, rgba(255,188,58,.16), rgba(77,136,232,.09)); border:1px solid rgba(255,188,58,.4);
    box-shadow:0 30px 60px -30px rgba(255,188,58,.45); opacity:0; transform:translateY(16px) scale(.95); }
  .finale.in-view .rank-card{ animation:rankIn .8s cubic-bezier(.2,.8,.2,1) .1s forwards; }
  @keyframes rankIn{ to{ opacity:1; transform:none; } }
  .rank-ico{ font-size:60px; line-height:1; margin-bottom:10px; }
  .rank-eyebrow{ font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .rank-title{ font-size:clamp(26px,5vw,34px); font-weight:900; line-height:1.2; margin-bottom:6px; }
  .rank-name{ font-size:15px; color:rgba(235,244,255,.6); margin-bottom:20px; }
  .rank-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .rs{ background:rgba(8,8,40,.55); border:1px solid rgba(235,244,255,.1); border-radius:14px; padding:12px 6px; }
  .rs b{ display:block; font-family:var(--mono); font-size:22px; color:var(--gold); line-height:1.2; }
  .rs span{ font-size:11.5px; color:rgba(235,244,255,.55); }
  .rank-share{ font-size:14px; line-height:1.6; color:rgba(235,244,255,.78); padding-top:16px; border-top:1px dashed rgba(235,244,255,.18); }
  .finale.in-view .finale-eyebrow{ animation-delay:.6s; }
  .finale.in-view .finale-num{ animation-delay:.75s; }
  .finale.in-view .finale-num-ring{ animation-delay:.75s; }
  .finale.in-view .finale-line{ animation-delay:1.05s; }
  .finale.in-view .finale-sub{ animation-delay:1.2s; }
  .finale.in-view .finale-people{ animation-delay:1.35s; }
  .finale.in-view .finale-reasons{ animation-delay:1.5s; }
  .finale.in-view .finale-principles{ animation-delay:1.7s; }
  .finale.in-view .finale-source{ animation-delay:1.9s; }
  .again-row{ display:flex; justify-content:center; margin-top:30px; }

  /* Mobile */
  @media (max-width:640px){
    .app{ padding:0 16px 60px; }
    .topbar{ padding:18px 0 16px; margin-bottom:28px; }
    .brand img{ height:28px; }
    .top-tag{ display:none; }
    .hud{ margin:0 -16px 22px; border-radius:0 0 16px 16px; border-left:none; border-right:none; }
    .hud-val{ font-size:17px; }
    .grid{ gap:14px; }
    .card{ flex-direction:row; min-height:180px; }
    .card:hover{ transform:none; }
    .card .photo-wrap{ width:38%; flex-shrink:0; aspect-ratio:auto; }
    .card .photo-wrap::after{ background:linear-gradient(90deg, transparent 55%, rgba(8,8,40,.6)); }
    html[dir="rtl"] .card .photo-wrap::after{ background:linear-gradient(270deg, transparent 55%, rgba(8,8,40,.6)); }
    .card .badge{ font-size:9px; left:8px; right:8px; bottom:8px; padding:6px 8px; }
    .card-num{ font-size:24px; top:10px; inset-inline-end:12px; }
    .info{ padding:16px 14px; display:flex; flex-direction:column; justify-content:center; }
    .name{ font-size:19px; }
    .role{ margin-bottom:8px; }
    .quote{ font-size:12.5px; min-height:0; }
    .tap-hint{ margin-top:10px; }
    .lock-ico{ font-size:30px; }
    .modal{ padding:30px 18px 26px; border-radius:20px; max-height:90vh; }
    .overlay{ padding:12px; align-items:flex-end; }
    .modal-title{ font-size:24px; }
    .opts.gaps{ grid-template-columns:1fr; }
    .intro-people .avatar{ width:54px; height:54px; }
    .rank-stats{ gap:6px; }
    .rs b{ font-size:18px; }
    .reasons-row{ grid-template-columns:repeat(2,1fr); }
  }
  @media (prefers-reduced-motion: reduce){
    .card.active, .start-btn{ animation:none; }
  }
  .finale{ z-index:70; }
  body.started .topbar{ margin-bottom:18px; }
  .card.locked .lock-layer{ background:rgba(8,8,40,.5); }
  .card.locked .info{ opacity:.25; }
</style>

}

let AC = null;
function initAudio(){
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){ AC = null; }
}
function beep(freq, dur, type, delay, vol){
  if (!G.sound || !AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}

      const a = Math.random() * Math.PI * 2, v = (3 + Math.random() * 6) * power;
      add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5 * power, g: .22, s: 5 + Math.random() * 5,
            r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: COLORS[i % COLORS.length], life: 0, max: 80 + Math.random() * 50 });
    }
  }
  function rain(n){
    if (reduceMotion) return;
    for (let i = 0; i < (n || 160); i++){
      add({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 2,
            vy: 2 + Math.random() * 3, g: .04, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
            c: COLORS[i % COLORS.length], life: 0, max: 280 });
    }
  }
  function loop(){
    const d = window.devicePixelRatio || 1;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
    for (const p of parts){
      p.life++; p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / 30));
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .62);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : null;
    if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  return { burst, rain };
})();
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

/* ===================== HUD ===================== */
function updateHud(){
  const n = solvedCount();
  document.getElementById('hudCases').textContent = n;
  document.getElementById('hudBarFill').style.width = (n / CASES.length * 100) + '%';
  document.getElementById('hudPoints').textContent = G.points;
  document.getElementById('hudTime').textContent = fmtTime(elapsed());
}
function popEl(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function addPoints(n, fromEl, isBonus){
  if (!n) return;
  G.points += n;
  const f = document.createElement('div');
  f.className = 'float-pts' + (isBonus ? ' bonus' : '');
  f.textContent = '+' + n;
  const [x, y] = fromEl ? centerOf(fromEl) : [innerWidth / 2, innerHeight / 2];
  f.style.left = x + 'px'; f.style.top = y + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1200);
  updateHud();
  popEl(document.getElementById('hudPoints'));
}

/* ===================== MISSION START ===================== */
function startMission(){
  if (G.started) return;
  initAudio();
  G.started = true;
  G.startTs = Date.now();
  G.name = (document.getElementById('playerName').value || '').trim();
  document.getElementById('introView').hidden = true;
  document.getElementById('mainView').hidden = false;
  document.getElementById('hud').classList.add('on');
  document.body.classList.add('started');
  G.timer = setInterval(updateHud, 1000);
  renderCards(); updateHud();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  SFX.solve();
  setTimeout(() => { const el = document.getElementById('card-' + CASES[0]); if (el){ const [x, y] = centerOf(el); FX.burst(x, y, 40, .8); } }, 250);
}

/* ===================== CARDS ===================== */
function renderCards(){
  const t = TR[currentLang], done = solvedCount();
  CASES.forEach((k, i) => {
    const card = document.getElementById('card-' + k), n = i + 1, st = CS[k];
    const locked = i > done, active = i === done && !st.solDone;
    card.classList.toggle('locked', locked);
    card.classList.toggle('active', active);
    card.classList.toggle('solved', st.solDone);
    card.setAttribute('aria-disabled', locked ? 'true' : 'false');
    document.getElementById('badge' + n).textContent = st.diagDone ? t.cards[i].badge : '?';
    document.getElementById('name' + n).textContent = t.cards[i].name;
    document.getElementById('role' + n).textContent = t.cards[i].role;
    document.getElementById('quote' + n).textContent = t.cards[i].quote;
    document.getElementById('hint' + n).textContent = locked ? t.hintLocked : (st.solDone ? t.hintSolved : t.hintOpen);
    card.querySelector('.lock-txt').textContent = t.locked;
    card.querySelector('.solved-stamp').textContent = t.solvedStamp;
    card.setAttribute('aria-label', t.cards[i].name + ' — ' + (locked ? t.locked : t.hintOpen));
  });
  const fin = document.getElementById('finishBtn');
  fin.hidden = done < CASES.length;
}

function openCase(k){
  if (!G.started) return;
  const idx = CASES.indexOf(k);
  if (idx > solvedCount()){
    const card = document.getElementById('card-' + k);
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    SFX.locked();
    return;
  }
  const st = CS[k];
  if (!st.opened) st.opened = Date.now();
  if (!st.diagOrder) st.diagOrder = shuffle(GAPS);
  if (!st.solOrder) st.solOrder = shuffle([0, 1, 2]);
  currentCase = k;
  renderCase();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modal').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeCase(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
  currentCase = null;
}

/* ===================== CASE MODAL ===================== */
function renderCase(){
  const k = currentCase; if (!k) return;
  const t = TR[currentLang], s = STORIES[k], loc = s[currentLang], st = CS[k], idx = CASES.indexOf(k);
  document.getElementById('modalEyebrow').textContent = t.caseOf(idx + 1);
  const badge = document.getElementById('modalBadge');
  if (st.diagDone){
    badge.textContent = loc.badgeText;
    badge.className = 'modal-badge';
    badge.style.color = '#' + s.badgeColor;
    badge.style.border = '1px solid #' + s.badgeColor + '66';
  } else {
    badge.textContent = t.unknownGap;
    badge.className = 'modal-badge unknown';
    badge.style.color = ''; badge.style.border = '';
  }
  document.getElementById('modalTitle').textContent = loc.title;
  document.getElementById('modalStats').innerHTML =
    '<div class="modal-stat ms-test"><div class="ms-label">' + t.statTest + '</div><div class="ms-val">' + loc.score + '</div></div>' +
    '<div class="modal-stat ms-field"><div class="ms-label">' + t.statField + '</div><div class="ms-val">' + loc.field + '</div></div>';
  document.getElementById('modalBody').textContent = loc.body;
  renderSteps();
}

function renderSteps(){
  const k = currentCase, t = TR[currentLang], st = CS[k], lang = currentLang;
  let h = '';

  // Step 1: diagnose
  h += '<div class="step' + (st.diagDone ? ' done' : '') + '" id="step1">';
  h += '<div class="step-head"><span class="step-num">' + (st.diagDone ? '✓' : '1') + '</span><span>' + t.step1Q + '</span></div>';
  h += '<div class="opts gaps">';
  st.diagOrder.forEach(g => {
    let cls = 'opt', dis = st.diagDone;
    if (st.diagWrong.includes(g)){ cls += ' wrong'; dis = true; }
    if (st.diagDone && g === GAP_OF[k]) cls += ' correct';
    h += '<button type="button" class="' + cls + '" data-gap="' + g + '"' + (dis ? ' disabled' : '') + '>' + gapLabel(g, lang) + '</button>';
  });
  h += '</div>';
  if (st.diagDone) h += '<div class="fb">' + t.diagRight(gapLabel(GAP_OF[k], lang)) + '</div>';
  else if (st.diagWrong.length) h += '<div class="fb bad">' + HINTS[k][lang] + '</div>';
  h += '</div>';

  // Step 2: prescribe
  if (st.diagDone){
    const opts = REFLECT[k][lang];
    h += '<div class="step' + (st.solDone ? ' done' : '') + '" id="step2">';
    h += '<div class="step-head"><span class="step-num">' + (st.solDone ? '✓' : '2') + '</span><span>' + REFLECT_Q[lang] + '</span></div>';
    h += '<div class="opts">';
    st.solOrder.forEach(i => {
      let cls = 'opt', dis = st.solDone;
      if (st.solWrong.includes(i)){ cls += ' wrong'; dis = true; }
      if (st.solDone && opts[i].ok) cls += ' correct';
      h += '<button type="button" class="' + cls + '" data-sol="' + i + '"' + (dis ? ' disabled' : '') + '>' + opts[i].t + '</button>';
    });
    h += '</div>';
    if (st.lastSol !== null){
      const o = opts[st.lastSol];
      h += '<div class="fb' + (o.ok ? '' : ' bad') + '">' + o.fb + '</div>';
    }
    h += '</div>';
  }

  // Case solved
  if (st.solDone){
    const last = CASES.indexOf(k) === CASES.length - 1;
    h += '<div class="case-closing">' + STORIES[k][lang].closing + '</div>';
    h += '<div class="play-fix show"><span class="pf-label">' + PLAY_FIX.label[lang] + ' ←</span><span class="pf-val">' + PLAY_FIX[k][lang] + '</span></div>';
    h += '<div class="case-done"><div class="cd-label">' + t.caseDone + '</div>';
    h += '<div class="cd-pts">' + st.pts + '</div>';
    h += '<div class="cd-bonus">' + (st.speed ? t.speedBonus : t.noSpeed) + '</div>';
    h += '<button type="button" class="finish-btn" id="nextBtn"><span>' + (last ? t.revealRank : t.nextCase) + '</span> <span class="dir-arrow-fwd"></span></button>';
    h += '</div>';
  }

  const box = document.getElementById('caseSteps');
  box.innerHTML = h;
  box.querySelectorAll('[data-gap]').forEach(b => b.addEventListener('click', () => pickDiag(b.dataset.gap, b)));
  box.querySelectorAll('[data-sol]').forEach(b => b.addEventListener('click', () => pickSol(parseInt(b.dataset.sol, 10), b)));
  const nb = document.getElementById('nextBtn');
  if (nb) nb.addEventListener('click', goNext);
}

function scrollModalTo(id){
  const el = document.getElementById(id), m = document.getElementById('modal');
  if (!el) return;
  setTimeout(() => m.scrollTo({ top: el.offsetTop - 20, behavior: reduceMotion ? 'auto' : 'smooth' }), 80);
}

function pickDiag(gap, btn){
  const k = currentCase, st = CS[k];
  if (st.diagDone) return;
  st.diagTries++;
  if (gap === GAP_OF[k]){
    st.diagDone = true;
    const gain = ptsFor(st.diagTries);
    st.pts += gain;
    SFX.correct();
    const [x, y] = centerOf(btn); FX.burst(x, y, 28, .6);
    addPoints(gain, btn);
    renderCase(); renderCards();
    scrollModalTo('step2');
  } else {
    st.diagWrong.push(gap);
    SFX.wrong();
    renderSteps();
    const nb = document.querySelector('[data-gap="' + gap + '"]');
    if (nb){ nb.classList.add('shake'); }
  }
}

function pickSol(i, btn){
  const k = currentCase, st = CS[k];
  if (st.solDone) return;
  st.solTries++;
  st.lastSol = i;
  const opt = REFLECT[k][currentLang][i];
  if (opt.ok){
    st.solDone = true;
    const gain = ptsFor(st.solTries);
    st.pts += gain;
    const [x, y] = centerOf(btn);
    addPoints(gain, btn);
    if ((Date.now() - st.opened) / 1000 <= SPEED_LIMIT){
      st.speed = SPEED_BONUS; st.pts += SPEED_BONUS;
      setTimeout(() => { addPoints(SPEED_BONUS, btn, true); SFX.bonus(); }, 450);
    }
    SFX.solve();
    FX.burst(x, y, 90, 1.1);
    if (solvedCount() === CASES.length) G.endTs = Date.now();
    renderSteps(); renderCards(); updateHud();
    scrollModalTo('step2');
  } else {
    st.solWrong.push(i);
    SFX.wrong();
    renderSteps();
    const nb = document.querySelector('[data-sol="' + i + '"]');
    if (nb) nb.classList.add('shake');
  }
}

function goNext(){
  const idx = CASES.indexOf(currentCase);
  closeCase();
  if (idx === CASES.length - 1){ showFinale(); return; }
  const next = CASES[idx + 1], card = document.getElementById('card-' + next);
  card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  setTimeout(() => {
    card.classList.remove('unlocking'); void card.offsetWidth; card.classList.add('unlocking');
    const [x, y] = centerOf(card); FX.burst(x, y, 50, .9);
    SFX.solve();
  }, 450);
}

/* ===================== FINALE ===================== */
const finale = document.getElementById('finale');
const finaleNum = document.getElementById('finaleNum');
const mainView = document.getElementById('mainView');

function rankFor(p){ return RANKS.find(r => p >= r.min); }
function fillFinale(){
  const t = TR[currentLang], r = rankFor(G.points);
  let first = 0; CASES.forEach(k => { if (CS[k].diagTries === 1) first++; if (CS[k].solTries === 1) first++; });
  document.getElementById('rankIco').textContent = r.ico;
  document.getElementById('rankEyebrow').textContent = t.rankEyebrow;
  document.getElementById('rankTitle').textContent = r[currentLang];
  document.getElementById('rankName').textContent = G.name || t.anon;
  document.getElementById('rsPoints').textContent = G.points;
  document.getElementById('rsTime').textContent = fmtTime(elapsed());
  document.getElementById('rsAcc').textContent = Math.round(first / (CASES.length * 2) * 100) + '%';
  document.getElementById('rsPointsLabel').textContent = t.rsPoints;
  document.getElementById('rsTimeLabel').textContent = t.rsTime;
  document.getElementById('rsAccLabel').textContent = t.rsAcc;
  document.getElementById('rankShare').textContent = t.rankShare;
}

function animateCount(target, duration){
  const start = performance.now();
  function tick(now){
    const p = Math.min((now - start) / duration, 1), eased = 1 - Math.pow(1 - p, 3);
    finaleNum.textContent = Math.round(eased * target) + '%';
    if (p < 1) requestAnimationFrame(tick); else finaleNum.textContent = target + '%';
  }
  requestAnimationFrame(tick);
}

function showFinale(){
  if (solvedCount() < CASES.length) return;
  if (!G.endTs) G.endTs = Date.now();
  clearInterval(G.timer); updateHud();
  fillFinale();
  mainView.classList.add('hiding');
  finale.classList.add('show');
  finale.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  finale.classList.remove('in-view');
  finaleNum.textContent = '0%';
  requestAnimationFrame(() => {
    finale.classList.add('in-view');
    setTimeout(() => animateCount(70, 1400), 750);
  });
  if (!G.finaleShown){ SFX.fanfare(); FX.rain(180); }
  else { FX.rain(60); }
  G.finaleShown = true;
}

function hideFinale(){
  finale.classList.remove('show');
  mainView.classList.remove('hiding');
  document.body.style.overflow = '';
}

/* ===================== LANGUAGE ===================== */
function setText(id, v){ const el = document.getElementById(id); if (el) el.textContent = v; }
function setHtml(id, v){ const el = document.getElementById(id); if (el) el.innerHTML = v; }

function applyLang(lang){
  currentLang = lang;
  const t = TR[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'مهمة محقق التدريب' : 'Training Detective Mission';

  setText('topTagText', t.topTag);
  setText('langToggle', t.langToggle);
  setText('headEyebrow', t.headEyebrow);
  setHtml('headTitle', t.headTitle);
  setText('headSub', t.headSub);
  setHtml('introRules', t.rules.map(r => '<li><span class="ri">' + r[0] + '</span><span>' + r[1] + '</span></li>').join(''));
  document.getElementById('playerName').placeholder = t.namePh;
  setText('startBtnText', t.startBtn);
  setText('hudCasesLabel', t.hudCases);
  setText('hudPointsLabel', t.hudPoints);
  setText('hudTimeLabel', t.hudTime);
  setText('casesTitle', t.casesTitle);
  setText('casesSub', t.casesSub);
  setText('finishBtnText', t.finishBtn);
  setText('finaleEyebrow', t.finaleEyebrow);
  setHtml('finaleLine', t.finaleLine);
  setText('finaleSub', t.finaleSub);
  setText('finaleSource', t.finaleSource);
  setText('finaleBackText', t.finaleBack);
  setText('againText', t.again);
  setText('footerText', t.footer);
  setText('principlesTitle', t.principlesTitle);
  setHtml('principlesList', t.principlesList.map(li => '<li><span>✦</span> <span>' + li + '</span></li>').join(''));
  setText('reasonsTitle', REASONS.title[lang]);
  setHtml('reasonsRow', REASONS.items.map((k, i) =>
    '<div class="reason-tile r' + (i + 1) + '"><div class="rt-title">' + PLAY_FIX[k][lang] + '</div><div class="rt-who">' + t.cards[CASES.indexOf(k)].name + '</div></div>'
  ).join(''));

  renderCards();
  if (currentCase) renderCase();
  if (finale.classList.contains('show')) fillFinale();
}

function toggleLang(){ applyLang(currentLang === 'ar' ? 'en' : 'ar'); }

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (document.getElementById('overlay').classList.contains('show')) closeCase();
    else if (finale.classList.contains('show')) hideFinale();
  }
});

document.querySelectorAll('img[data-from]').forEach(im => { im.src = document.querySelector('#card-' + im.dataset.from + ' .avatar-svg').src; });
applyLang('ar');
</script>
